spring.application.name=auth-service
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# JWT — generate a 256-bit Base64 key for production
jwt.secret=dGhpcylzYS1kZXYtc2VjcmV0LWtleS10aGF0LWlzLWxvbmctZW5vdWdoLTI1Ng==
jwt.expiration-ms=86400000

# Email (SMTP) — set MAIL_USERNAME + MAIL_PASSWORD env vars to enable OTP delivery
# Gmail example: create an App Password at myaccount.google.com/apppasswords
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# MFA settings
mfa.otp-ttl-seconds=60
mfa.otp-max-attempts=3
mfa.login-max-attempts=5
mfa.lock-duration-minutes=15
# Set false in production — OTP delivered by email/SMS instead of returned in response
mfa.otp-hint-enabled=true
